<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>Input Types Example</h2>
    <form>
        <label>Enter Name</label>
        <input type="text" placeholder="Enter Name" >

        <label>Enter Email</label>
        <input type="Email" placeholder="Enter Email" >
        <br><br>
        <label>Aadhar Number</label>
        <input type="Number" placeholder="Enter Aadhar NUmber" >

        <label> Enter Password</label>
        <input type="password" placeholder="Enter password" >
        <br><br>

        <label>Enter date</label>
        <input type="date">

        <label>Enter month</label>
        <input type="month">

        <label>Enter week</label>
        <input type="week">

        <label>Enter Time</label>
        <input type="time">

        <label>Enter Date and time</label>
        <input type="datetime-local">

        <br><br>

        <label>Choose Cities</label>
        <input type="checkbox">Mumbai
        <input type="checkbox">Pune
        <input type="checkbox">Nashik
        <input type="checkbox">Delhi
        <br><br>
        <label>Select Gender</label>
        <input type="radio" name="Gender">Male
        <input type="radio" name="Gender">Female
        <input type="radio" name="Gender">Other

        <br>
        <label>Select Color</label>
        <input type="color">

        <label>Select Range</label>
        <input type="range">

        <label>Select Docs</label>
        <input type="file" multiple>
        <br><br>
        <label>Search</label>
        <input type="search" placeholder="type here search">

        <label>Enter URL</label>
        <input type="url" placeholder="https">

        <label>Enter telephone</label>
        <input type="tel" placeholder="9860244098">

        <br><br>
        <label>Select City</label>
        <select>
            <option>Choose your city...</option>
            <option>mumbai</option>
            <option>nashik</option>
            <option>pune</option>
            <option>jalgon</option>
        </select>
        <label>Enter Address</label>
        <textarea rows="5" cols="5"></textarea>
        <br><br>

        <input type="submit" value="submit form" >
        <input type="button" value="submit form" >
        <input type="reset" value="reset form" >
        <br><br><br>

        
    </form>
</body>
</html>
